# Runs the whole app with one command:  docker compose up --build
#   Frontend: http://localhost:3000
#   Backend:  http://localhost:8080/api/resources

services:
  backend:
    build: .
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
