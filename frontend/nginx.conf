server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Send API calls to the backend container (named "backend" in docker-compose.yml).
    # This does the same job as the proxy in vite.config.js does during development.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Everything else is the React app
    location / {
        try_files $uri /index.html;
    }
}
