spring.application.name=mentalhealth-backend

# Port: 8080 locally; hosting platforms can override it with a PORT variable
server.port=${PORT:8080}

# ---------- MySQL connection ----------
# Defaults point at the MySQL container from docker-compose.yml (or a local MySQL
# with user root / password root). For the hosted database, set DB_URL,
# DB_USERNAME and DB_PASSWORD as environment variables. Never commit real passwords.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mental_health_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA / Hibernate ----------
# The tables are created by database/schema.sql (designed by the database team),
# NOT by Hibernate. "validate" only checks that the @Entity classes match those tables
# and stops the app with a clear error if they don't.
spring.jpa.hibernate.ddl-auto=validate

# Keep table/column names exactly as written in schema.sql (USER, userId, firstName...).
# Without this, Hibernate would look for user_id, first_name, etc.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Quote every name so table names like USER work everywhere and keep their exact case
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
