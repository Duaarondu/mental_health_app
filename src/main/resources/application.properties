spring.application.name=mentalhealth-backend

# Port: 8080 locally; hosting platforms can override it with a PORT variable
server.port=${PORT:8080}

# ---------- MySQL connection ----------
# Defaults point at the MySQL container from docker-compose.yml (or a local MySQL
# with user root / password root). For the hosted database, set DB_URL,
# DB_USERNAME and DB_PASSWORD as environment variables. Never commit real passwords.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mental_health_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA / Hibernate ----------
# The tables are created by database/schema.sql (designed by the database team),
# NOT by Hibernate. "validate" only checks that the @Entity classes match those tables
# and stops the app with a clear error if they don't.
spring.jpa.hibernate.ddl-auto=validate

# Keep table/column names exactly as written in schema.sql (USER, userId, firstName...).
# Without this, Hibernate would look for user_id, first_name, etc.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Quote every name so table names like USER work everywhere and keep their exact case
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true

spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Login sessions ----------
# Sessions are stored in the database (tables SPRING_SESSION and SPRING_SESSION_ATTRIBUTES,
# created automatically), so users stay logged in across restarts and multiple servers.
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=8h
# The cookie can't be read by JavaScript, is only sent over HTTPS when deployed,
# and is never sent by other websites (protects against CSRF).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---------- App settings ----------
# Demo accounts for presentations (see README). Set SEED_DEMO_DATA=false on a public site.
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.demo-password=${DEMO_PASSWORD:Demo1234!}
# Time zone used to decide what "in the future" means when booking
app.time-zone=${APP_TIME_ZONE:America/New_York}
# Key that encrypts journal entries (AES-256). Make one with: openssl rand -base64 32
# Set JOURNAL_KEY on the hosted server (from Secret Manager). Never commit it.
# If it's missing, a built-in development key is used and a warning is logged.
app.journal-key=${JOURNAL_KEY:}
