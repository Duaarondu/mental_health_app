<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="hero">
        <nav class="nav">
            <span class="logo">MindCare</span>
            <div class="nav-links">
                <a href="#resources">Resources</a>
                <a href="#book">Book</a>
                <a href="#appointments">My Appointments</a>
            </div>
        </nav>
        <div class="hero-text">
            <!-- Filled in from GET /api/home -->
            <h1 id="welcome">Loading...</h1>
            <p>Support is here when you need it. Explore resources or book a session below.</p>
            <a href="#book" class="btn">Book an appointment</a>
        </div>
    </header>

    <main>
        <!-- Resources: filled in from GET /api/resources -->
        <section id="resources">
            <h2>Resources</h2>
            <div id="resource-list" class="cards"></div>
        </section>

        <!-- Booking form: sends POST /api/appointments -->
        <section id="book">
            <h2>Book an Appointment</h2>
            <form id="booking-form" class="panel">
                <label for="type">Type of appointment</label>
                <select id="type" required>
                    <option value="">Choose one...</option>
                </select>

                <div class="row">
                    <div>
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div>
                        <label for="time">Time</label>
                        <input type="time" id="time" required>
                    </div>
                </div>

                <button type="submit" class="btn">Book appointment</button>
                <p id="form-message" class="message"></p>
            </form>
        </section>

        <!-- Booked appointments: filled in from GET /api/appointments -->
        <section id="appointments">
            <h2>My Appointments</h2>
            <ul id="appointment-list" class="panel list"></ul>
        </section>
    </main>

    <footer>
        <p>If you are in crisis, call or text <strong>988</strong> (Suicide &amp; Crisis Lifeline, US) or call <strong>911</strong>.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
