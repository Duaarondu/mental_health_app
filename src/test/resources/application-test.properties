# Used by tests (and therefore by CI): an in-memory H2 database in MySQL mode,
# so tests run anywhere without a MySQL server.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Tests don't run schema.sql; H2 builds the tables from the @Entity classes instead
spring.jpa.hibernate.ddl-auto=create-drop

# Tests create their own users
app.seed-demo-data=false
